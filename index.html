<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY BAR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#0d0d0d;
color:white;
font-family:'Poppins',sans-serif;
}

header{
background:black;
padding:25px;
text-align:center;
border-bottom:3px solid #d40000;
}

header img{
width:120px;
border-radius:50%;
}

h1{
margin-top:15px;
font-size:42px;
letter-spacing:4px;
color:#fff;
}

.lang{
margin-top:15px;
}

.lang button{
background:#d40000;
color:white;
border:none;
padding:10px 20px;
margin:5px;
cursor:pointer;
border-radius:30px;
font-size:16px;
}

nav{
display:flex;
overflow:auto;
gap:10px;
padding:15px;
background:#151515;
position:sticky;
top:0;
z-index:999;
}

nav a{
text-decoration:none;
color:white;
background:#d40000;
padding:10px 18px;
border-radius:25px;
white-space:nowrap;
}

section{
padding:45px 20px;
max-width:1000px;
margin:auto;
}

h2{
color:#ff2d2d;
margin-bottom:20px;
border-left:5px solid #ff2d2d;
padding-left:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #333;
font-size:18px;
}

.price{
font-weight:bold;
color:#fff;
}

footer{
background:black;
padding:40px;
text-align:center;
border-top:3px solid #d40000;
}

footer a{
color:#ff4040;
text-decoration:none;
display:block;
margin:10px;
}

</style>

</head>

<body>

<header>

<h1>FLY BAR</h1>

<p>Chorzowska 100 • Katowice</p>

<div class="lang">
<button>🇵🇱 Polski</button>
<button>🇬🇧 English</button>
</div>

</header>

<nav>

<a href="#kawa">☕ Kawa</a>
<a href="#napoje">🥤 Napoje</a>
<a href="#sniadanie">🍳 Śniadanie</a>
<a href="#obiady">🍽 Obiady</a>
<a href="#zupy">🍲 Zupy</a>
<a href="#salatki">🥗 Sałatki</a>
<a href="#fastfood">🍔 Fast Food</a>
<a href="#koktajle">🍹 Koktajle</a>
<a href="#desery">🍰 Desery</a>

</nav>
